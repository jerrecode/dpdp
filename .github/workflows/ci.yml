name: Linux C CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libjson-c-dev pkg-config make gcc python3 iproute2
      - name: Build
        run: make
      - name: Validate installer syntax
        run: bash -n scripts/install.sh scripts/diagnose.sh tests/smoke.sh tests/sleep_states.sh
      - name: Integration test
        run: make test
      - name: Address and undefined behavior sanitizers
        run: make sanitize
